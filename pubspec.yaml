name: prompt_loop
description: "AI-powered skill development through deliberate practice loops"
publish_to: 'none'

version: 1.0.8+10

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.3.0

  # Local Storage
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # Charts & Visualization
  fl_chart: ^1.2.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  equatable: ^2.1.0
  json_annotation: ^4.12.0
  
  # LLM Integration
  langchain: ^0.8.0+1
  langchain_openai: ^0.8.0+1
  langchain_google: ^0.7.0+1
  langchain_anthropic: ^0.3.0+1
  googleai_dart: ^3.6.0
  openai_dart: ^0.6.2
  anthropic_sdk_dart: ^0.3.1
  
  # HTTP
  http: ^1.6.0

  # Sharing
  share_plus: ^13.2.1
  receive_sharing_intent: ^1.9.0
  
  # App Info
  package_info_plus: ^10.2.1
  
  # URL Launcher
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  json_serializable: ^6.14.0

  # Testing
  mocktail: ^1.0.5

  # Icon Generation

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# Icon configuration (use generated SVG in assets/icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/prompt_loop_icon.png"
  adaptive_icon_background: "#60A5FA"
  adaptive_icon_foreground: "assets/icons/prompt_loop_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
